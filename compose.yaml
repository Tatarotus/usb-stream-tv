services:
  usb-stream-tv:
    build: .
    container_name: usb-stream-tv
    restart: unless-stopped
    environment:
      - PORT=8080
      - TV_PIN=1233
      - STANDBY_TIMEOUT=90.0
      - PYTHONUNBUFFERED=1
      - CHANNELS_FILE=/app/channels_deploy.json
      - MOVIES_DIR=/app/filmes
      - RESIDENTIAL_HTTP_PROXY=http://172.20.0.1:8118
      - RESIDENTIAL_SOCKS_PROXY=socks5h://172.20.0.1:1080
      - STREAM_RESOLUTION=1080p
      - SLATE_GAP_THRESHOLD=3.0


    volumes:
      - ./filmes:/app/filmes
      - ./server.py:/app/server.py
      - ./channels.json:/app/channels.json
      - ./channels_deploy.json:/app/channels_deploy.json
      - ./fuse_direct_arm_verified:/app/fuse_direct_arm_verified
      - ./fat_template.bin:/app/fat_template.bin
      - ./start_clean.sh:/app/start_clean.sh
      - ./slate.ts:/app/slate.ts
      - ./slate_1080p.ts:/app/slate_1080p.ts
      - ./gen_template.py:/app/gen_template.py
      - ./fuse_direct_arm32:/app/fuse_direct_arm32
      - ./fuse_direct_arm64:/app/fuse_direct_arm64
      - ./switch_vod.sh:/app/switch_vod.sh
      - ./switch_live.sh:/app/switch_live.sh
      - ./tv_watchdog.sh:/app/tv_watchdog.sh
      - ./watch_writer.sh:/app/watch_writer.sh
      - ./vod_cache:/app/vod_cache
    networks:
      - gateway_net

networks:
  gateway_net:
    external: true
